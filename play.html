<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6c63ff"><title>Typing Game — Word Pop</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:#f6f7ff;color:#202238;overflow:hidden}button{font:inherit}.top{height:64px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid #e7e8f2;position:relative;z-index:20}.logo{display:flex;align-items:center;gap:10px;font-weight:900}.logo i{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:#6c63ff;color:white;font-style:normal}.top button{border:0;background:#f0f1f8;padding:9px 13px;border-radius:11px;cursor:pointer;font-weight:800;color:#555a72}.game{height:calc(100vh - 64px);position:relative;overflow:hidden;background:linear-gradient(#dff5ff 0%,#eef4ff 56%,#d9f1db 56%,#bde7c1 100%)}.sun{position:absolute;width:110px;height:110px;border-radius:50%;background:#ffd85a;right:9%;top:8%;box-shadow:0 0 0 16px rgba(255,216,90,.14)}.cloud{position:absolute;width:110px;height:30px;background:white;border-radius:50px;opacity:.85}.cloud:before,.cloud:after{content:"";position:absolute;background:white;border-radius:50%}.cloud:before{width:45px;height:45px;left:18px;top:-20px}.cloud:after{width:58px;height:58px;right:15px;top:-30px}.c1{left:8%;top:17%}.c2{right:25%;top:29%;transform:scale(.7)}.hill{position:absolute;left:-10%;right:-10%;bottom:25%;height:34%;background:#8bcf91;border-radius:50% 50% 0 0}.hill2{bottom:20%;background:#70bd78;opacity:.7}.hud{position:absolute;z-index:10;top:16px;left:16px;right:16px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.stat{background:rgba(255,255,255,.94);border:1px solid #e4e5ef;border-radius:14px;padding:8px 15px;text-align:center;box-shadow:0 5px 15px rgba(45,49,90,.08);min-width:90px}.stat small{display:block;color:#8a8fa5;font-size:9px;font-weight:800;letter-spacing:.1em}.stat b{font-size:20px}.stat.combo b{color:#ff8a00}.hearts{color:#ff5d77}.word{position:absolute;z-index:6;min-width:90px;padding:11px 16px;border-radius:18px;background:white;border:3px solid #282b45;box-shadow:0 7px 0 rgba(40,43,69,.12);font-weight:900;text-align:center;transition:transform .1s}.word:before{content:"";position:absolute;width:12px;height:12px;background:inherit;border-left:3px solid #282b45;border-bottom:3px solid #282b45;bottom:-8px;left:50%;transform:translateX(-50%) rotate(-45deg)}.word.target{border-color:#6c63ff;box-shadow:0 0 0 5px rgba(108,99,255,.16),0 7px 0 rgba(40,43,69,.12);transform:scale(1.08)}.word .mini{font-size:18px;margin-right:5px}.ground{position:absolute;z-index:4;left:0;right:0;bottom:0;height:25%;background:linear-gradient(#69b86f,#54a85e)}.hero{position:absolute;z-index:5;bottom:7%;left:50%;transform:translateX(-50%);font-size:75px;filter:drop-shadow(0 8px 0 rgba(40,43,69,.15));user-select:none}.blast{position:absolute;z-index:7;width:9px;height:9px;border-radius:50%;background:#ffd84a;box-shadow:0 0 20px #ffd84a;animation:shot .18s linear forwards}.burst{position:absolute;z-index:12;font-weight:1000;font-size:27px;pointer-events:none;animation:burst .6s forwards}.good{color:#1ca66b}.bad{color:#ef5368}.comboPop{color:#ff8a00;font-size:34px}@keyframes shot{from{transform:scale(.5)}to{transform:scale(5);opacity:0}}@keyframes burst{0%{opacity:0;transform:translate(-50%,0) scale(.6)}20%{opacity:1;transform:translate(-50%,-8px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-65px) scale(.95)}}.bottom{position:absolute;z-index:15;left:50%;bottom:16px;transform:translateX(-50%);width:min(700px,calc(100% - 28px));text-align:center}.hint{display:inline-block;background:rgba(255,255,255,.88);padding:8px 13px;border-radius:20px;color:#777c94;font-size:12px;margin-bottom:8px}.hint b{color:#4e51c8}.bar{height:7px;background:rgba(255,255,255,.65);border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;width:100%;background:#6c63ff;transition:width .2s}.screen{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:rgba(246,247,255,.72);backdrop-filter:blur(7px)}.screen.hide{display:none}.card{width:min(460px,calc(100% - 28px));background:#fff;border:1px solid #e3e4ef;border-radius:25px;padding:30px;text-align:center;box-shadow:0 24px 70px rgba(42,45,83,.18)}.card .emoji{font-size:60px}.card h1{margin:8px 0;font-size:40px;letter-spacing:-.05em}.card p{color:#777d96;line-height:1.6}.play{border:0;background:#6c63ff;color:white;border-radius:14px;padding:14px 25px;font-weight:900;cursor:pointer;box-shadow:0 7px 0 #4e48bd}.secondary{margin-left:7px;border:0;background:#eef0f8;color:#4d526c;border-radius:14px;padding:14px 18px;font-weight:900;cursor:pointer}.pause{position:absolute;right:16px;bottom:16px;z-index:18;border:0;background:#fff;color:#4e5269;width:44px;height:44px;border-radius:13px;box-shadow:0 6px 18px rgba(40,43,69,.12);cursor:pointer;font-weight:900}.mobile-tip{display:none}@media(max-width:650px){.top{height:56px;padding:0 12px}.game{height:calc(100vh - 56px)}.stat{min-width:72px;padding:7px 9px}.stat b{font-size:17px}.hud{top:10px;gap:5px}.hero{font-size:58px;bottom:9%}.word{padding:9px 12px;font-size:14px}.bottom{bottom:10px}.hint{font-size:11px}.mobile-tip{display:block}.card h1{font-size:33px}.sun{width:75px;height:75px}}
</style></head>
<body>
<header class="top"><div class="logo"><i>T</i><span>Typing Game</span></div><button id="home">Home</button></header>
<main class="game" id="game"><div class="sun"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="hill"></div><div class="hill hill2"></div><div class="hud"><div class="stat"><small>SCORE</small><b id="score">0</b></div><div class="stat combo"><small>COMBO</small><b id="combo">0×</b></div><div class="stat"><small>WPM</small><b id="wpm">0</b></div><div class="stat"><small>ACCURACY</small><b id="acc">100%</b></div><div class="stat"><small>BEST</small><b id="best">0</b></div><div class="stat hearts"><small>LIVES</small><b id="lives">♥♥♥</b></div></div><div id="words"></div><div class="ground"></div><div class="hero">🧙‍♂️</div><div class="bottom"><div class="hint">Just <b>type anywhere</b> — matching words pop automatically!</div><div class="bar"><span id="danger"></span></div></div><button class="pause" id="pause" title="Pause">Ⅱ</button><div class="screen" id="screen"><div class="card"><div class="emoji">🎈</div><h1 id="title">Word Pop!</h1><p id="message">Pop the flying words before they reach the ground. You don't need to find an input box — just type.</p><button class="play" id="play">PLAY</button><button class="secondary" id="free">FREE PLAY</button><div class="mobile-tip">On mobile, tap PLAY to bring up your keyboard.</div></div></div></main>
<script>
(()=>{const $=id=>document.getElementById(id),game=$('game'),layer=$('words'),screen=$('screen'),input=document.createElement('input');input.style='position:fixed;opacity:0;pointer-events:none;left:-1000px;top:-1000px';input.autocomplete='off';document.body.appendChild(input);let s={run:false,score:0,combo:0,lives:3,correct:0,errors:0,chars:0,start:0,words:[],speed:34,spawn:1000,free:false,last:0};const pool=['sun','moon','star','apple','music','happy','jump','light','code','game','blue','fire','gold','smile','candy','bunny','rocket','rainbow','cookie','magic','planet','future','thunder','galaxy','typing','speed','focus','keyboard','browser','energy','victory'];const best=()=>+localStorage.getItem('wordpop-best')||0;$('best').textContent=best();function reset(){s={...s,run:false,score:0,combo:0,lives:3,correct:0,errors:0,chars:0,start:0,words:[],speed:34,spawn:1000,last:0};layer.innerHTML='';paint()}function paint(){ $('score').textContent=s.score;$('combo').textContent=s.combo+'×';$('wpm').textContent=s.correct?Math.round((s.chars/5)/Math.max((Date.now()-s.start)/60000,.01)):0;$('acc').textContent=(s.correct+s.errors)?Math.round(s.correct/(s.correct+s.errors)*100)+'%':'100%';$('lives').textContent='♥'.repeat(s.lives)+'♡'.repeat(3-s.lives);$('best').textContent=best();$('danger').style.width=Math.max(0,s.lives/3*100)+'%'}function pop(text,cls,x,y){const e=document.createElement('div');e.className='burst '+cls;e.textContent=text;e.style.left=x+'px';e.style.top=y+'px';game.appendChild(e);setTimeout(()=>e.remove(),650)}function spawn(){if(!s.run)return;const e=document.createElement('div');e.className='word';const w=pool[Math.floor(Math.random()*pool.length)];e.innerHTML='<span class="mini">'+['⭐','🍀','🚀','🦊','🍩','🌈'][Math.floor(Math.random()*6)]+'</span>'+w;e.style.left=(4+Math.random()*88)+'%';e.style.top='-55px';layer.appendChild(e);s.words.push({el:e,w,y:-55})}function hit(w){const i=s.words.findIndex(x=>x.w===w);if(i<0){s.errors++;s.combo=0;pop('Oops!','bad',innerWidth/2,170);paint();return}const x=s.words[i],r=x.el.getBoundingClientRect(),gr=game.getBoundingClientRect();x.el.remove();s.words.splice(i,1);s.correct++;s.chars+=w.length;s.combo++;const mult=1+Math.floor(s.combo/7)*.25;s.score+=Math.round(w.length*10*mult);pop(s.combo%7===0?'🔥 '+s.combo+' COMBO!':'+'+Math.round(w.length*10*mult),'good',r.left-gr.left,r.top-gr.top);if(s.combo%7===0)pop('NICE!','comboPop',gr.width/2,gr.height*.35);paint()}function miss(x){x.el.remove();s.words=s.words.filter(a=>a!==x);if(!s.free){s.lives--;s.combo=0;pop('MISS!','bad',innerWidth/2,160)}if(s.lives<=0)end();paint()}function loop(t){if(!s.run)return;const dt=Math.min(32,t-s.last);s.last=t;for(const x of s.words.slice()){x.y+=s.speed*dt/1000;x.el.style.top=x.y+'px';if(x.y>game.clientHeight*.76)miss(x)}s.speed=Math.min(105,s.speed+.003*dt);paint();requestAnimationFrame(loop)}function start(free=false){reset();s.free=free;s.run=true;s.start=Date.now();screen.classList.add('hide');input.focus();s.spawnTimer=setInterval(spawn,s.spawn);spawn();requestAnimationFrame(loop)}function end(){if(!s.run)return;s.run=false;clearInterval(s.spawnTimer);const b=best();if(s.score>b)localStorage.setItem('wordpop-best',s.score);screen.classList.remove('hide');$('title').textContent=s.score>b?'🏆 NEW BEST!':'Great Run!';$('message').innerHTML='<b>'+s.score+'</b> points · <b>'+s.combo+'×</b> best combo · <b>'+$('wpm').textContent+' WPM</b>';paint()}function pause(){if(!s.run)return;s.run=false;screen.classList.remove('hide');$('title').textContent='Paused';$('message').textContent='Take a breath. Your run is waiting.';$('play').textContent='RESUME';$('free').style.display='none'}$('play').onclick=()=>{if($('title').textContent==='Paused'){screen.classList.add('hide');s.run=true;s.last=performance.now();input.focus();requestAnimationFrame(loop)}else start(false)};$('free').onclick=()=>start(true);$('pause').onclick=pause;$('home').onclick=()=>location.href='index.html';document.addEventListener('keydown',e=>{if(e.target===input)return;if(e.key==='Escape'){pause();return}if(e.key.length===1&&/[a-zA-Z]/.test(e.key)){input.focus()}});input.addEventListener('input',()=>{const v=input.value.toLowerCase();if(v){const target=s.words.find(x=>x.w.startsWith(v));s.words.forEach(x=>x.el.classList.toggle('target',x===target))}if(s.words.some(x=>x.w===v)){hit(v);input.value=''}});paint();game.addEventListener('pointerdown',()=>input.focus())})();
</script></body></html>
