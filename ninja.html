<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#87c86b"><title>Ninja Branch Climb — Typing Game</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Patrick+Hand&display=swap" rel="stylesheet"><style>:root{--ink:#203126;--green:#77b95d;--deep:#2f6840;--cream:#fffaf0;--wood:#9b6338;--leaf:#5eaa58;--gold:#f4b83f;--red:#ef665f;--blue:#6ab2f0}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:#bfe2a2}body{overflow:hidden}.game{height:100dvh;position:relative;overflow:hidden;background:linear-gradient(#a9d9ee 0 42%,#b8d996 42% 100%)}.sky{position:absolute;inset:0;pointer-events:none}.sun{position:absolute;width:110px;height:110px;border-radius:50%;background:#ffe89a;right:9%;top:8%;box-shadow:0 0 50px #fff0a0}.cloud{position:absolute;width:130px;height:35px;border-radius:40px;background:#fff9;filter:blur(.2px)}.cloud:before,.cloud:after{content:"";position:absolute;background:#fff9;border-radius:50%}.cloud:before{width:60px;height:60px;left:20px;top:-27px}.cloud:after{width:75px;height:75px;right:20px;top:-39px}.c1{left:8%;top:16%}.c2{right:22%;top:28%;transform:scale(.72)}.mountain{position:absolute;bottom:27%;width:0;height:0;border-left:180px solid transparent;border-right:180px solid transparent;border-bottom:240px solid #87bd78;opacity:.65}.m1{left:4%}.m2{right:4%;transform:scale(1.25)}.forest{position:absolute;bottom:0;left:0;right:0;height:31%;background:linear-gradient(#6ca85a,#4f874c)}.tree{position:absolute;bottom:0;width:90px;height:230px;background:#5e513b;border-radius:40px 40px 8px 8px}.tree:before,.tree:after{content:"";position:absolute;background:#4e9650;border-radius:50%}.tree:before{width:150px;height:150px;left:-40px;top:-80px}.tree:after{width:130px;height:130px;right:-50px;top:-50px}.t1{left:3%;transform:scale(.8)}.t2{right:4%;transform:scale(.95)}.hud{position:absolute;z-index:20;top:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center}.pill{background:#fffdf5e8;border:2px solid #24432c;border-radius:16px;padding:8px 14px;min-width:88px;text-align:center;box-shadow:0 5px 0 #24432c18}.pill small{display:block;font-size:10px;font-weight:900;color:#69806c;letter-spacing:.08em}.pill b{font-size:20px}.hearts{color:var(--red);letter-spacing:2px}.pause{width:44px;height:44px;border:2px solid #24432c;border-radius:14px;background:#fffdf5;font-size:18px;cursor:pointer;box-shadow:0 5px 0 #24432c18}.timer{position:fixed;top:72px;left:50%;transform:translateX(-50%);z-index:21;width:min(420px,65vw);height:10px;background:#ffffff80;border:2px solid #24432c55;border-radius:99px;overflow:hidden}.timer span{display:block;width:100%;height:100%;background:linear-gradient(90deg,var(--green),var(--gold));transform-origin:left center;transition:width .08s linear}.timer.danger span{background:linear-gradient(90deg,#ef665f,#f4b83f)}.timer-label{position:fixed;top:88px;left:50%;transform:translateX(-50%);z-index:21;font-size:11px;font-weight:900;color:#35533c;background:#fffdf5d9;padding:3px 8px;border-radius:9px}.world{position:absolute;inset:0;z-index:5;transition:transform .7s cubic-bezier(.2,.8,.2,1)}.branch{position:absolute;height:18px;background:linear-gradient(#b97945,#87502d);border:3px solid #633d27;border-radius:50px;box-shadow:0 7px 0 #51351f55;transition:transform .18s,filter .18s}.branch:before,.branch:after{content:"";position:absolute;width:34px;height:34px;background:#5da555;border-radius:50%;top:-18px}.branch:before{left:15%}.branch:after{right:18%}.branch.cracking{filter:saturate(1.25);animation:crack .18s infinite alternate}.branch.broken{animation:break .42s forwards}@keyframes crack{to{transform:translateX(3px) rotate(.7deg)}}@keyframes break{to{transform:translateY(30px) rotate(6deg);opacity:0}}.word{position:absolute;left:50%;top:-43px;transform:translateX(-50%);background:#fffdf3;border:3px solid #28442d;border-radius:13px;padding:7px 13px;font-size:18px;font-weight:900;white-space:nowrap;box-shadow:0 5px 0 #28442d22;transition:.12s}.word .done{color:var(--green)}.word.active{border-color:#e5a92d;box-shadow:0 0 0 5px #f4b83f33,0 5px 0 #28442d22}.word span.typed{color:#6c63ff}.word span.remaining{color:#28442d}.word span.mismatch{color:var(--red)}.ninja{position:absolute;z-index:12;width:74px;height:88px;display:grid;place-items:center;font-size:58px;filter:drop-shadow(0 8px 3px #29462b33);transition:left .35s,bottom .35s}.ninja.jump{animation:jump .72s cubic-bezier(.2,.75,.25,1)}@keyframes jump{0%{transform:translateY(0) rotate(0)}30%{transform:translateY(-118px) rotate(-7deg) scale(1.08)}65%{transform:translateY(-84px) rotate(7deg) scale(1.04)}100%{transform:translateY(0) rotate(0)}}.ninja.land{animation:land .26s}@keyframes land{50%{transform:scale(1.14,.82)}100%{transform:scale(1)}}.ninja.fall{animation:ninfall .7s forwards}@keyframes ninfall{to{transform:translateY(380px) rotate(150deg);opacity:.2}}.leaf{position:absolute;z-index:14;font-size:25px;animation:leaf 1s forwards;pointer-events:none}@keyframes leaf{to{transform:translate(var(--x),var(--y)) rotate(300deg);opacity:0}}.reward{position:absolute;z-index:30;font-weight:900;color:#8b6416;animation:reward 1s forwards;pointer-events:none}@keyframes reward{to{transform:translateY(-65px);opacity:0}}.progress{position:absolute;z-index:22;left:50%;bottom:92px;transform:translateX(-50%);background:#fffdf3e8;border:2px solid #24432c;border-radius:14px;padding:7px 11px;font-size:13px;font-weight:900;box-shadow:0 5px 0 #24432c18;min-width:180px;text-align:center}.progress b{color:#6c63ff}.bottom{position:absolute;z-index:25;left:50%;bottom:16px;transform:translateX(-50%);background:#fffdf4e8;border:2px solid #24432c;border-radius:18px;padding:9px 14px;text-align:center;box-shadow:0 6px 0 #24432c18}.bottom b{font-family:'Patrick Hand',cursive;font-size:22px}.hint{display:block;font-size:11px;color:#758575;margin-top:2px}.capture{position:fixed;left:-100px;bottom:0;width:10px;height:10px;opacity:.01;border:0;outline:0}.overlay{position:absolute;z-index:50;inset:0;display:grid;place-items:center;background:#25432c55;backdrop-filter:blur(4px)}.card{width:min(430px,calc(100% - 28px));background:#fffdf3;border:3px solid #24432c;border-radius:26px;padding:30px;text-align:center;box-shadow:0 13px 0 #24432c33}.card .emoji{font-size:65px}.card h1{font-family:'Patrick Hand',cursive;font-size:48px;line-height:.9;margin:8px 0;color:#315e39}.card p{color:#687768;line-height:1.55;margin:10px 0 18px}.play{border:0;border-radius:15px;background:#77b95d;color:#fff;padding:14px 28px;font-size:17px;font-weight:900;cursor:pointer;box-shadow:0 5px 0 #477c3e}.secondary{border:2px solid #315e39;background:#fffdf3;color:#315e39;border-radius:15px;padding:11px 18px;font-weight:900;cursor:pointer;margin-left:6px}.hide{display:none}.tip{font-size:11px;color:#879284;margin-top:14px}.scoreline{display:flex;justify-content:center;gap:18px;margin:15px 0}.scoreline strong{display:block;font-size:25px}.scoreline span{font-size:10px;color:#879284;font-weight:900;letter-spacing:.08em}.shake{animation:shake .2s}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}@media(max-width:600px){.hud{top:9px;gap:4px}.pill{min-width:68px;padding:6px 8px}.pill b{font-size:16px}.pill small{font-size:8px}.pause{width:39px;height:39px}.timer{top:61px;width:72vw}.timer-label{top:77px}.bottom{bottom:10px;max-width:calc(100% - 20px);width:max-content}.progress{bottom:75px}.word{font-size:16px;padding:6px 10px}.ninja{font-size:48px}.branch{height:15px}.forest{height:25%}.card{padding:24px}.card h1{font-size:42px}}</style></head><body><main class="game" id="game"><div class="sky"><div class="sun"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="mountain m1"></div><div class="mountain m2"></div><div class="forest"><i class="tree t1"></i><i class="tree t2"></i></div></div><div class="hud"><div class="pill"><small>HEIGHT</small><b id="height">0m</b></div><div class="pill"><small>SCORE</small><b id="score">0</b></div><div class="pill"><small>COINS</small><b id="coins">0</b></div><div class="pill"><small>LIVES</small><b class="hearts" id="lives">♥♥♥</b></div><button class="pause" id="pause" aria-label="Pause game">Ⅱ</button></div><div class="timer" id="timer"><span id="timerFill"></span></div><div class="timer-label" id="timerLabel">TIME TO JUMP</div><div class="world" id="world"><div class="ninja" id="ninja">🥷</div></div><div class="progress" id="progress">Next: <b>—</b></div><div class="bottom"><b id="current">Type the word to climb!</b><span class="hint">Type anywhere · your letters appear in the branch word</span></div><input class="capture" id="capture" aria-label="Typing input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"><div class="overlay" id="overlay"><div class="card"><div class="emoji">🥷</div><h1 id="title">Ninja Branch Climb</h1><p id="message">Climb as high as you can. Type the word on the next branch before the branch breaks.</p><button class="play" id="play">START CLIMB</button><div class="tip">Desktop: just type · Mobile: tap the game and type</div></div></div></main><script>
(()=>{const $=id=>document.getElementById(id),world=$('world'),ninja=$('ninja'),capture=$('capture'),overlay=$('overlay'),title=$('title'),message=$('message'),play=$('play'),current=$('current'),progress=$('progress'),timer=$('timer'),timerFill=$('timerFill'),timerLabel=$('timerLabel'),game=$('game');const words=['tree','leaf','jump','wind','river','cloud','forest','shadow','monkey','sunlight','bamboo','mountain','adventure','moonlight','thunder','waterfall','firefly','champion','ninja','treasure','starlight','wildflower','mistyforest','moonshadow'];let branches=[],level=0,score=0,coins=0,lives=3,typed='',running=false,paused=false,best=Number(localStorage.getItem('ninja-best')||0),deadline=0,lastFrame=0,scrollOffset=0;function chooseWord(){const max=Math.min(words.length,7+Math.floor(level/3));let pool=words.slice(0,max);if(level<5)pool=pool.filter(w=>w.length<=8);return pool[Math.floor(Math.random()*pool.length)]}function make(){world.querySelectorAll('.branch,.word,.leaf,.reward').forEach(e=>e.remove());branches=[];const spacing=Math.max(78,92-Math.min(14,Math.floor(level/8)));for(let i=0;i<40;i++){const y=window.innerHeight-125-i*spacing;const left=8+(i%2===0?Math.random()*46:42+Math.random()*42);const width=Math.min(window.innerWidth*.44,220+Math.random()*120);const b=document.createElement('div');b.className='branch';b.style.left=left+'%';b.style.width=width+'px';b.style.bottom=(window.innerHeight-y)+'px';const w=document.createElement('div');w.className='word';w.dataset.text=chooseWord();b.appendChild(w);world.appendChild(b);branches.push({el:b,word:w.dataset.text.toLowerCase(),y,left,width});renderWord(i); }placeNinja(0);setTarget();}function renderWord(i){const b=branches[i];if(!b)return;const w=b.el.querySelector('.word');const text=b.word;const target=i===level?typed:'';w.innerHTML='';for(let j=0;j<text.length;j++){const s=document.createElement('span');s.textContent=text[j];s.className=j<target.length?(target[j]===text[j]?'typed':'mismatch'):'remaining';w.appendChild(s)}}function renderCurrent(){renderWord(level);current.textContent=branches[level]?branches[level].word:'Climb!';progress.innerHTML=branches[level]?`Next: <b>${branches[level].word}</b>`:'Keep climbing!'}function placeNinja(i){const b=branches[i];if(!b)return;ninja.style.left=(parseFloat(b.el.style.left)+(parseFloat(b.el.style.width)/window.innerWidth*50)-4)+'%';ninja.style.bottom=(window.innerHeight-b.y-45)+'px'}function scrollToLevel(){const targetOffset=Math.max(0,level*64);scrollOffset=Math.min(targetOffset,Math.max(0,window.innerHeight*.32));world.style.transform=`translateY(${scrollOffset}px)`}function setTarget(){branches.forEach((b,i)=>b.el.querySelector('.word').classList.toggle('active',i===level));renderCurrent();startDeadline()}function update(){ $('height').textContent=level+'m';$('score').textContent=score;$('coins').textContent=coins;$('lives').textContent='♥'.repeat(lives)+'♡'.repeat(3-lives)}function startDeadline(){if(!running)return;const base=Math.max(3200,7000-level*95);const lengthBonus=Math.min(1700,(branches[level]?.word.length||4)*180);deadline=performance.now()+base+lengthBonus}function confetti(){for(let i=0;i<9;i++){const e=document.createElement('span');e.className='leaf';e.textContent=['🍃','🍂','🌿','🍀'][i%4];e.style.left=(50+Math.random()*14-7)+'%';e.style.top='45%';e.style.setProperty('--x',(Math.random()*220-110)+'px');e.style.setProperty('--y',(Math.random()*150-70)+'px');world.appendChild(e);setTimeout(()=>e.remove(),1000)}}function reward(){const e=document.createElement('div');e.className='reward';e.textContent='+ '+(100+level*12)+' 🪙';e.style.left='50%';e.style.top='45%';world.appendChild(e);setTimeout(()=>e.remove(),1000)}function jump(){const next=branches[level];if(!next)return;score+=100+level*12;coins+=5+Math.floor(level/4);level++;typed='';capture.value='';ninja.classList.remove('jump');void ninja.offsetWidth;ninja.classList.add('jump');confetti();reward();setTimeout(()=>{ninja.classList.remove('jump');ninja.classList.add('land');placeNinja(level);scrollToLevel();setTimeout(()=>ninja.classList.remove('land'),260);},640);update();setTarget()}function fail(reason='wrong'){lives--;typed='';capture.value='';game.classList.remove('shake');void game.offsetWidth;game.classList.add('shake');if(branches[level])branches[level].el.classList.remove('cracking');ninja.classList.add('fall');setTimeout(()=>ninja.classList.remove('fall'),720);update();if(lives<=0){end(reason)}else{current.textContent=reason==='time'?'Too slow! Try again!':'Mistake! Watch the word!';startDeadline();setTimeout(()=>{renderCurrent()},450)}}function animate(now){if(!running){lastFrame=now;requestAnimationFrame(animate);return}if(!paused){const left=Math.max(0,deadline-now);const total=Math.max(1,deadline-(deadline-(7000-Math.min(3800,level*95))));const pct=Math.min(1,left/(Math.max(1,7000-Math.min(3800,level*95)+(branches[level]?.word.length||4)*180)));timerFill.style.width=(pct*100)+'%';timer.classList.toggle('danger',pct<.25);timerLabel.textContent=pct<.25?'HURRY!':'TIME TO JUMP';if(left<=0){timerFill.style.width='0%';fail('time')}}lastFrame=now;requestAnimationFrame(animate)}function key(e){if(!running||paused)return;if(e.key.length!==1||!/^[a-zA-Z]$/.test(e.key))return;e.preventDefault();const ch=e.key.toLowerCase(),target=branches[level]?.word||'';typed+=ch;if(!target)return;if(target.startsWith(typed)){renderCurrent();if(typed===target)jump()}else{fail('wrong')}}function start(){running=true;paused=false;score=0;coins=0;lives=3;level=0;typed='';world.style.transform='translateY(0)';make();update();overlay.classList.add('hide');capture.focus();startDeadline()}function end(reason){running=false;paused=false;if(score>best){best=score;localStorage.setItem('ninja-best',best)}title.textContent=score>=best?'NEW BEST!':'RUN OVER';message.innerHTML=`You climbed <b>${level}m</b>, collected <b>${coins} coins</b> and scored <b>${score}</b>.<br>${reason==='time'?'The branch broke because you took too long.':'A mistake sent your ninja falling.'}`;play.textContent='CLIMB AGAIN';overlay.classList.remove('hide');timerFill.style.width='0%'}function togglePause(){if(!running)return;paused=!paused;if(paused){overlay.classList.remove('hide');title.textContent='PAUSED';message.textContent='Your ninja is safe. Press Resume when you are ready.';play.textContent='RESUME CLIMB'}else{overlay.classList.add('hide');play.textContent='CLIMB AGAIN';startDeadline();capture.focus()}}play.onclick=()=>paused?togglePause():start();document.addEventListener('keydown',key);game.addEventListener('pointerdown',()=>{if(running&&!paused)capture.focus()});$('pause').onclick=togglePause;window.addEventListener('resize',()=>{if(running){make();placeNinja(level);scrollToLevel()}});update();requestAnimationFrame(animate)})();</script></body></html>
